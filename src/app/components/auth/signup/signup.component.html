<section class="vh-100 gradient-custom">
    <div class="container py-5 h-100">
        <div class="row justify-content-center align-items-center h-100">
            <div class="col-12 col-lg-9 col-xl-7">
                <div class="card shadow-2-strong card-registration" style="border-radius: 15px;">
                    <div class="card-body p-4 p-md-5">
                        <h3 class="mb-4 pb-2 pb-md-0 mb-md-5">Registration Form</h3>
                        <form [formGroup]="signUpForm" (submit)="onSubmit()">

                            <div class="row">
                               
                                    <div data-mdb-input-init class="form-outline">
                                        <input type="text" id="firstName" class="form-control form-control-lg" formControlName = 'name' />
                                        <label class="form-label" for="firstName">First Name</label>
                                    </div>

                               

                            </div>



                            <div class="row">
                                <div class="col-md-6 mb-4 pb-2">

                                    <div data-mdb-input-init class="form-outline">
                                        <input type="email" id="emailAddress" class="form-control form-control-lg" formControlName="email" />
                                        <label class="form-label" for="emailAddress">Email</label>
                                    </div>

                                </div>
                                <div class="col-md-6 mb-4 pb-2">

                                    <div data-mdb-input-init class="form-outline">
                                        <input type="password" id="password" class="form-control form-control-lg" formControlName="password" />
                                        <label class="form-label" for="password">Password</label>
                                    </div>

                                </div>

                            </div>

                            <div class="row">
                                <div class="col-12">

                                    <select class="select form-control-lg" placeholder="select role" formControlName="role">
                                        <option value="user" disabled>Role</option>
                                        <option value="user">user</option>
                                        <option value="admin">admin</option>


                                    </select>
                                </div>
                            </div>
                            <div class="row">

                                <div class="mt-4 pt-2 col-sm-6">
                                    <input data-mdb-ripple-init class="btn btn-primary btn-lg" type="submit" 
                                    value="Submit" />
                                    
                                </div>
                                <div class="mt-4 pt-2 col-sm-6">
                                    <span>Dont have account? 
                                        <a data-mdb-ripple-init value="Submit" [routerLink]="['/auth','login']" >Login</a>
                                    </span>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
